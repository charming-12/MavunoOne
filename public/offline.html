<!doctype html>
<html lang="sw">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071b13" />
    <title>MavunoOne — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #071b13; color: #f7faf8; }
      main { width: min(92vw, 560px); padding: 40px; border: 1px solid rgba(255,255,255,.14); border-radius: 24px; background: linear-gradient(145deg, #102d20, #071b13); box-shadow: 0 24px 70px rgba(0,0,0,.28); }
      .brand { color: #19d58b; font-size: 1.35rem; font-weight: 800; letter-spacing: -.03em; }
      .status { display: inline-flex; margin: 32px 0 18px; padding: 8px 12px; border-radius: 999px; background: rgba(245,181,36,.14); color: #ffd66b; font-size: .76rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0 0 14px; font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.05; }
      p { color: #b9c9c0; line-height: 1.7; }
      button { margin-top: 18px; border: 0; border-radius: 12px; padding: 13px 18px; background: #f5b524; color: #132016; font-weight: 800; cursor: pointer; }
      small { display: block; margin-top: 22px; color: #7e9689; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">MavunoOne</div>
      <div class="status">Offline mode</div>
      <h1>Muonekano wako umehifadhiwa.</h1>
      <p>Hakuna internet kwa sasa. MavunoOne itaendelea kutumia app shell iliyohifadhiwa. Taarifa za fedha, malipo, SMS na mabadiliko ya mwisho ya database zitasubiri connection irudi.</p>
      <button onclick="location.reload()">Jaribu tena</button>
      <small>Ukiwa online tena, refresh ukurasa ili kupata taarifa mpya.</small>
    </main>
  </body>
</html>
